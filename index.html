<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inktober 2026 Gallery</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎃</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Inktober 2026</h1>
    <p class="sub">31 days, 31 drawings. Newest on top. Tap a name to see just their work.</p>
  </header>

  <nav class="site-nav" aria-label="Site">
    <div class="btn-row tabs" id="tabs" role="group" aria-label="View">
      <button type="button" data-action="view" data-view="gallery" aria-pressed="true">Gallery</button>
      <button type="button" data-action="view" data-view="prompts" aria-pressed="false">Prompts</button>
      <button type="button" data-action="view" data-view="grid" aria-pressed="false">Who posted</button>
      <button type="button" data-action="view" data-view="recap" aria-pressed="false">Recap</button>
    </div>
    <div class="btn-row">
      <button type="button" id="today" data-action="today">Jump to today</button>
      <button type="button" data-action="share">Copy link</button>
    </div>
  </nav>

  <div class="filters" role="search">
    <div class="tags" id="tags" role="group" aria-label="Filter by artist"></div>
    <button type="button" class="link" id="reset" data-action="reset" hidden>Clear</button>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <p class="nudge" id="nudge" aria-live="polite"></p>

  <main id="main"><p class="empty">Summoning the drawings…</p></main>
  <footer><p>Happy Inktober 🕯️ Every drawing belongs to its artist.</p></footer>

  <dialog class="viewer" id="viewer" aria-label="Drawing viewer">
    <button type="button" class="viewer-close" data-action="close" aria-label="Close viewer">✕</button>
    <button type="button" class="viewer-step prev" data-action="prev" aria-label="Previous drawing">‹</button>
    <figure>
      <img id="viewer-img" alt="" referrerpolicy="no-referrer">
      <figcaption>
        <div class="viewer-word" id="viewer-word"></div>
        <div class="viewer-meta" id="viewer-meta"></div>
        <div class="viewer-actions">
          <button type="button" id="viewer-artist" data-action="viewer-artist"></button>
          <a id="viewer-full" target="_blank" rel="noopener">Open full size</a>
        </div>
        <span class="viewer-count" id="viewer-count"></span>
      </figcaption>
    </figure>
    <button type="button" class="viewer-step next" data-action="next" aria-label="Next drawing">›</button>
  </dialog>
</body>
</html>
